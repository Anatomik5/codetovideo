name: Feature request
description: Suggest an idea. Please check ROADMAP.md first.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the project rules
      options:
        - label: It needs no hardcoded sites / button texts / languages
        - label: It needs no paid service
        - label: I would be willing to help build or test it

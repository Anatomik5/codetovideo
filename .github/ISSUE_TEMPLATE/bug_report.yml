name: Bug report
description: Something in CTV itself is broken (not just "the agent could not navigate my app": use a Run report for that).
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (command line or app clicks)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node version, CTV version/commit
      placeholder: "Windows 11, Node 22.14, v0.2.0"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      render: text

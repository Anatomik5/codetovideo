" y="521.5" font-size="11" text-anchor="middle" fill="#334155">save</text><line x1="1060" y1="615" x2="990" y2="615" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="1004" y="597" width="42" height="16" fill="#ffffff" opacity="0.92"/><text x="1025" y="609" font-size="11" text-anchor="middle" fill="#334155">clips</text><line x1="720" y1="615" x2="650" y2="615" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><line x1="1195" y1="665" x2="1195" y2="760" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="1177.4" y="694.5" width="35.2" height="16" fill="#ffffff" opacity="0.92"/><text x="1195" y="706.5" font-size="11" text-anchor="middle" fill="#334155">edit</text><line x1="1060" y1="810" x2="990" y2="810" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><line x1="720" y1="810" x2="650" y2="810" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="640.2" y="792" width="89.6" height="16" fill="#ffffff" opacity="0.92"/><text x="685" y="804" font-size="11" text-anchor="middle" fill="#334155">text / style</text><line x1="855" y1="860" x2="855" y2="935" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="803.4" y="879.5" width="103.2" height="16" fill="#ffffff" opacity="0.92"/><text x="855" y="891.5" font-size="11" text-anchor="middle" fill="#334155">browser change</text><line x1="602.1794871794872" y1="760" x2="767.8205128205128" y2="665" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="650.4" y="694.5" width="69.19999999999999" height="16" fill="#ffffff" opacity="0.92"/><text x="685" y="706.5" font-size="11" text-anchor="middle" fill="#334155">re-render</text><line x1="900.9459459459459" y1="935" x2="1149.054054054054" y2="665" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="993.8" y="782" width="62.4" height="16" fill="#ffffff" opacity="0.92"/><text x="1025" y="794" font-size="11" text-anchor="middle" fill="#334155">new clip</text><line x1="970" y1="90" x2="1060" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="977" y="72" width="76" height="16" fill="#ffffff" opacity="0.92"/><text x="1015" y="84" font-size="11" text-anchor="middle" fill="#334155">pre-flight</text><line x1="1060" y1="124.74264705882354" x2="650" y2="230.25735294117646" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="820.4" y="159.5" width="69.19999999999999" height="16" fill="#ffffff" opacity="0.92"/><text x="855" y="171.5" font-size="11" text-anchor="middle" fill="#334155">plan JSON</text><line x1="1195" y1="140" x2="1195" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="1126.4" y="159.5" width="137.2" height="16" fill="#ffffff" opacity="0.92"/><text x="1195" y="171.5" font-size="11" text-anchor="middle" fill="#334155">button roles, steps</text><line x1="650" y1="474.74264705882354" x2="1060" y2="580.2573529411765" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/><rect x="810.2" y="509.5" width="89.6" height="16" fill="#ffffff" opacity="0.92"/><text x="855" y="521.5" font-size="11" text-anchor="middle" fill="#334155">backdrop SVG</text><rect x="40" y="40" width="270" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175" y="75" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Desktop app / CLI</text><text x="175" y="92" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">prompt · repo or URL · uploads</text><text x="175" y="109" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">format · quality · background</text><rect x="700" y="40" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="835" y="75" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">LLM Health &amp; Keep-Alive</text><text x="835" y="92" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">auto-start `ollama serve`, warm-up,</text><text x="835" y="109" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">retries, one num_ctx</text><rect x="1060" y="40" width="270" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1195" y="75" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Your LLM (any OpenAI-compatible)</text><text x="1195" y="92" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">local Ollama qwen3.5:4b, Gemini,</text><text x="1195" y="109" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">OpenRouter, Groq ...</text><rect x="40" y="215" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="175" y="250" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">1 · Repo Study</text><text x="175" y="267" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">file tree, README, manifests,</text><text x="175" y="284" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">launch scripts</text><rect x="380" y="215" width="270" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="515" y="250" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">2 · AI Director (LLM)</text><text x="515" y="267" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">scenes, titles, captions, pacing,</text><text x="515" y="284" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">palette, language, motif</text><rect x="720" y="215" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="855" y="250" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">3 · Process Executor</text><text x="855" y="267" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">safe launch command, no shell,</text><text x="855" y="284" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">port discovery, tree cleanup</text><rect x="1060" y="215" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1195" y="250" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">4 · Scene-aware Browser Agent</text><text x="1195" y="267" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Playwright, DOM/ARIA; LLM reads</text><text x="1195" y="284" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">button labels; real hi-res capture</text><rect x="380" y="390" width="270" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="515" y="425" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Backdrop (demo format)</text><text x="515" y="442" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">auto · model draws · model picks</text><text x="515" y="459" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">neutral animated motifs</text><rect x="1060" y="390" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1195" y="425" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Real screen recording</text><text x="1195" y="442" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">sliced at clicks into</text><text x="1195" y="459" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">clips/scene_NN.mp4</text><rect x="1060" y="565" width="270" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1195" y="608.5" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">5 · Session store (out/sessions/&lt;id&gt;/)</text><text x="1195" y="625.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">manifest.json · clips/ · props.json</text><rect x="720" y="565" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="855" y="600" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">6 · Compose (FFmpeg + Remotion)</text><text x="855" y="617" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Demo or Promo format</text><text x="855" y="634" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">480p to 4K, no audio</text><rect x="380" y="565" width="270" height="100" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="515" y="600" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Final video</text><text x="515" y="617" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">sessions/&lt;id&gt;/final.mp4</text><text x="515" y="634" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">out/demo.mp4</text><rect x="1060" y="760" width="270" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1195" y="795" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Edit request</text><text x="1195" y="812" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">--edit-scene N --edit-prompt</text><text x="1195" y="829" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">(or Edit tab in the app)</text><rect x="720" y="760" width="270" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="855" y="803.5" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">LLM classifies the edit</text><text x="855" y="820.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">text/style or re-shoot</text><rect x="380" y="760" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="515" y="795" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Mode A · text / style / backdrop</text><text x="515" y="812" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">patch manifest, partial render,</text><text x="515" y="829" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">rest copied with ffmpeg -c copy</text><rect x="720" y="935" width="270" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="855" y="970" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0f172a">Mode B · re-shoot one scene</text><text x="855" y="987" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">replay earlier steps headlessly,</text><text x="855" y="1004" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">record only that clip</text><rect x="40" y="1090" width="16" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="64" y="1103" font-size="12" fill="#334155">input / request</text><rect x="310" y="1090" width="16" height="16" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="334" y="1103" font-size="12" fill="#334155">LLM (director, classifier)</text><rect x="580" y="1090" width="16" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="604" y="1103" font-size="12" fill="#334155">real tools: Playwright · FFmpeg · Remotion</text><rect x="850" y="1090" width="16" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="874" y="1103" font-size="12" fill="#334155">saved session</text><rect x="1120" y="1090" width="16" height="16" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="1144" y="1103" font-size="12" fill="#334155">output</text></svg>